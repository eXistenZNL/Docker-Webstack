name: Build containers

on:
  workflow_dispatch:
  pull_request:
  push:
  schedule:
    - cron: "0 1 * * *"

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7
      - name: Check that every image is based on a stable Alpine release
        # See docs/adr/0001-edge-images-use-stable-base.md
        run: |
          if grep -HnE '^FROM ' *.Dockerfile | grep -vE '^[^:]+:[0-9]+:FROM (alpine:[0-9]+\.[0-9]+|base|default)( |$)'; then
            echo "Base images must be alpine:<major>.<minor>. Edge images take only their PHP packages from edge."
            exit 1
          fi

  build:
    needs: check
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        tag: ["8.3", "8.4", "8.5", "8.6-edge"]
        mode: ["default", "rootless"]
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7
      - name: Build the container for testing
        run: make build TAG=$(printenv TAG) MODE=$(printenv MODE)
        env:
          TAG: ${{ matrix.tag }}
          MODE: ${{ matrix.mode }}
      - name: Start the container
        run: make start TAG=$(printenv TAG) MODE=$(printenv MODE) && sleep 10
        env:
          TAG: ${{ matrix.tag }}
          MODE: ${{ matrix.mode }}
      - name: Show the PHP version
        run: |
          VERSIONS=$(make version)
          echo "$VERSIONS"
          echo "$VERSIONS" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      - name: Test the container
        run: make test TAG=$(printenv TAG) MODE=$(printenv MODE)
        env:
          TAG: ${{ matrix.tag }}
          MODE: ${{ matrix.mode }}
      - name: Login to Docker Hub
        if: github.repository_owner == 'eXistenZNL' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build multi-arch and push the container to Docker Hub
        if: github.repository_owner == 'eXistenZNL' && github.ref == 'refs/heads/main'
        run: make buildx-and-push TAG=$(printenv TAG) MODE=$(printenv MODE)
        env:
          TAG: ${{ matrix.tag }}
          MODE: ${{ matrix.mode }}
