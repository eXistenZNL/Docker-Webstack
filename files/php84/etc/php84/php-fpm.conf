[global]
pid = /var/run/php-fpm.pid
error_log = /proc/self/fd/2
log_level = notice
daemonize  = no

[www]
user = php
group = php

listen = 127.0.0.1:9000
catch_workers_output = yes
decorate_workers_output = no

; Allow access to the environment variables that were passed on to Docker
clear_env = no

; TEMPORARY mitigation for CVE-2026-109618 / CVE-2026-109619: lock the
; upload-progress kill switch so a .user.ini or per-dir config cannot
; re-enable it. Remove once the patched PHP package is in the image.
php_admin_flag[session.upload_progress.enabled] = off

; Process manager
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Health check
ping.path = /php-fpm-ping

; Include other configuration files
include=/etc/php84/php-fpm.d/*.conf
